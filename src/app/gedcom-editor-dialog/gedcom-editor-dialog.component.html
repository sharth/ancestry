<dialog #editDialog (cancel)="onDialogCancel($event)">
  @defer (when editDialog.open) {
    <app-gedcom-editor
      [type]="type()"
      [xref]="xref()"
      [ancestryDatabase]="ancestryDatabase()"
      [additionalTabs]="additionalTabs()"
      (finished)="editDialog.close()"
    />
  }
</dialog>
