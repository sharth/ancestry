@if (vm(); as vm) {
  <h1>{{ vm.title }}</h1>

  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="facts" routerLinkActive="active">
        Facts
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="sources" routerLinkActive="active">
        Sources
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="gedcom" routerLinkActive="active">
        Gedcom
      </a>
    </li>
  </ul>

  <router-outlet />
} @else {
  <h1>Family {{ xref() }} not found</h1>
}
