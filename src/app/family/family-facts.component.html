@if (vm(); as vm) {
  <div class="row">
    <div class="col-md-6">
      <h2>Events</h2>
      <app-events-timeline [events]="vm.events" />
    </div>

    <div class="col-md-6">
      <h2>Relatives</h2>
      <app-family-relatives
        [ancestryDatabase]="ancestryDatabase()"
        [family]="vm.family"
      />
    </div>
  </div>
}
