<div class="form-floating">
  <textarea
    [id]="id + '-abbr'"
    class="form-control h-auto"
    [formField]="form.abbr"
  ></textarea>
  <label [for]="id + '-abbr'">Short Title</label>
</div>

<div class="form-floating">
  <textarea
    [id]="id + '-title'"
    class="form-control h-auto"
    [formField]="form.title"
  ></textarea>
  <label [for]="id + '-title'">Title</label>
</div>

<div class="form-floating">
  <textarea
    [id]="id + '-text'"
    class="form-control h-auto"
    [formField]="form.text"
  ></textarea>
  <label [for]="id + '-text'">Text</label>
</div>

<app-input-repository-links
  [formField]="form.repositoryLinks"
  [workingDatabase]="workingDatabase()"
></app-input-repository-links>

<app-input-multimedia-links
  [formField]="form.multimediaLinks"
  [workingDatabase]="workingDatabase()"
></app-input-multimedia-links>

<app-input-unknown-records
  [formField]="form.unknownRecords"
  [workingDatabase]="workingDatabase()"
></app-input-unknown-records>
