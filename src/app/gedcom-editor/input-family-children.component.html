<details open>
  <summary>
    Children ({{ form.length }})<button
      type="button"
      class="btn btn-sm btn-outline-primary ms-auto py-0"
      (click)="$event.preventDefault(); appendChild()"
    >
      <i class="bi bi-plus"></i> Add child
    </button>
  </summary>
  @for (childXref of form; track childXref) {
    <div class="d-flex gap-2 align-items-center mb-2">
      <div class="flex-grow-1">
        <app-input-individual-xref
          [formField]="childXref"
          label="Child"
          [workingDatabase]="workingDatabase()"
        ></app-input-individual-xref>
      </div>
      <button
        class="btn btn-sm btn-outline-danger bi-trash"
        type="button"
        aria-label="Remove child"
        (click)="removeChild($index)"
      ></button>
    </div>
  }
</details>
