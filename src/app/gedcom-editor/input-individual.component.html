<app-input-individual-names
  [open]="true"
  [formField]="form.names"
  [workingDatabase]="workingDatabase()"
></app-input-individual-names>

<app-input-individual-sex
  [open]="true"
  [formField]="form.sex"
  [workingDatabase]="workingDatabase()"
></app-input-individual-sex>

<app-input-individual-facts
  [open]="true"
  [formField]="form.facts"
  [workingDatabase]="workingDatabase()"
></app-input-individual-facts>

@if (database(); as database) {
  <app-input-individual-families
    [formField]="database"
    [workingDatabase]="workingDatabase()"
    [individualXref]="value().xref"
  ></app-input-individual-families>
}

<app-input-notes
  [open]="true"
  [formField]="form.notes"
  [workingDatabase]="workingDatabase()"
></app-input-notes>

<app-input-unknown-records
  [open]="true"
  [formField]="form.unknownRecords"
  [workingDatabase]="workingDatabase()"
></app-input-unknown-records>

<app-input-change-date
  [workingDatabase]="workingDatabase()"
  [formField]="form.changeDate"
></app-input-change-date>
