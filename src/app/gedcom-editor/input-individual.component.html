<app-input-individual-names
  [open]="true"
  [formField]="form.names"
  [workingDatabase]="workingDatabase()"
></app-input-individual-names>

<app-input-individual-sex
  [open]="true"
  [formField]="form.sex"
  [workingDatabase]="workingDatabase()"
></app-input-individual-sex>

<app-input-individual-facts
  [open]="true"
  [formField]="form.facts"
  [workingDatabase]="workingDatabase()"
></app-input-individual-facts>

@if (gedcomEditor && familyLinks().length) {
  <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
    @for (link of familyLinks(); track link.relationship + link.xref) {
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="openFamily(link.xref)"
        title="Edit this family in a session tab"
      >
        <i class="bi bi-people me-1"></i>{{ link.relationship }}:
        {{ link.label }}
      </button>
    }
  </div>
}

<app-input-notes
  [open]="true"
  [formField]="form.notes"
  [workingDatabase]="workingDatabase()"
></app-input-notes>

<app-input-unknown-records
  [open]="true"
  [formField]="form.unknownRecords"
  [workingDatabase]="workingDatabase()"
></app-input-unknown-records>

<app-input-change-date
  [workingDatabase]="workingDatabase()"
  [formField]="form.changeDate"
></app-input-change-date>
