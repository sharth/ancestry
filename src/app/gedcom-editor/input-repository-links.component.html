<details open>
  <summary>
    Repositories ({{ form.length }})<button
      type="button"
      class="btn btn-sm btn-outline-primary ms-auto py-0"
      (click)="$event.preventDefault(); appendCitation()"
    >
      <i class="bi bi-plus"></i> Add repository link
    </button>
  </summary>
  @for (formGroup of form; track formGroup) {
    @let repositoryXref = formGroup.repositoryXref().value();
    <details open>
      <summary>
        <button
          class="btn btn-sm btn-outline-danger bi-trash"
          type="button"
          aria-label="Remove repository link"
          (click)="removeCitation($index)"
        ></button>
        {{
          workingDatabase().repositories[repositoryXref]?.name ??
            "Unknown repository"
        }}
      </summary>
      <div class="d-flex gap-2 align-items-center mb-2">
        <div class="flex-grow-1">
          <app-input-repository-xref
            [formField]="formGroup.repositoryXref"
            [workingDatabase]="workingDatabase()"
          ></app-input-repository-xref>
        </div>
        @if (gedcomEditor) {
          <!-- <button
            type="button"
            class="btn btn-sm btn-outline-primary text-nowrap"
            (click)="createNewRepository($index)"
            title="Create a new repository and open in tab"
          >
            <i class="bi bi-plus"></i> New
          </button>
          @if (repositoryXref) {
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary text-nowrap"
              /* (click)="openRepositoryInSession(repositoryXref)" */
              title="Edit repository in a session tab"
            >
              <i class="bi bi-pencil"></i> Edit
            </button>
          } -->
        }
      </div>
      <app-input-repository-call-numbers
        [formField]="formGroup.callNumbers"
        [workingDatabase]="workingDatabase()"
      ></app-input-repository-call-numbers>
    </details>
  }
</details>
