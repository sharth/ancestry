@if (family(); as family) {
  <app-input-individual-xref
    [value]="family.husbandXref"
    label="Husband"
    (valueChange)="updateMembers({ husbandXref: $event })"
    [workingDatabase]="workingDatabase()"
  ></app-input-individual-xref>

  <app-input-individual-xref
    [value]="family.wifeXref"
    label="Wife"
    (valueChange)="updateMembers({ wifeXref: $event })"
    [workingDatabase]="workingDatabase()"
  ></app-input-individual-xref>

  <app-input-family-children
    [value]="family.childXrefs"
    (valueChange)="updateMembers({ childXrefs: $event })"
    [workingDatabase]="workingDatabase()"
  ></app-input-family-children>
}

@if (familyForm(); as familyForm) {
  <app-input-family-facts
    [formField]="familyForm.facts"
    [workingDatabase]="workingDatabase()"
  ></app-input-family-facts>

  <app-input-source-citations
    [formField]="familyForm.citations"
    [workingDatabase]="workingDatabase()"
  ></app-input-source-citations>
}
