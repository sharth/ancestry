<details open>
  <summary>
    Names ({{ form.length }})<button
      type="button"
      class="btn btn-sm btn-outline-primary ms-auto py-0"
      (click)="$event.preventDefault(); appendName()"
    >
      <i class="bi bi-plus"></i> Add name
    </button>
  </summary>
  @for (name of form; track name) {
    <details open>
      <summary>
        <button
          type="button"
          class="btn btn-sm btn-outline-danger bi-trash"
          aria-label="Remove name"
          (click)="removeName($index)"
        ></button>
        {{ name.prefix().value() }}
        {{ name.givenName().value() }}
        {{ name.surnamePrefix().value() }}
        {{ name.surname().value() }}
        {{ name.suffix().value() }}
      </summary>
      <div class="fields-grid">
        <div class="form-floating">
          <input
            #focusTarget
            class="form-control"
            [id]="id + '-prefix-' + $index"
            [formField]="name.prefix"
          />
          <label [for]="id + '-prefix-' + $index">Prefix</label>
        </div>
        <div class="form-floating">
          <input
            class="form-control"
            [id]="id + '-given-' + $index"
            [formField]="name.givenName"
          />
          <label [for]="id + '-given-' + $index">Given Name</label>
        </div>
        <div class="form-floating">
          <input
            class="form-control"
            [id]="id + '-nick-' + $index"
            [formField]="name.nickName"
          />
          <label [for]="id + '-nick-' + $index">Nickname</label>
        </div>
        <div class="form-floating">
          <input
            class="form-control"
            [id]="id + '-surname-prefix-' + $index"
            [formField]="name.surnamePrefix"
          />
          <label [for]="id + '-surname-prefix-' + $index">Surname Prefix</label>
        </div>
        <div class="form-floating">
          <input
            class="form-control"
            [id]="id + '-surname-' + $index"
            [formField]="name.surname"
          />
          <label [for]="id + '-surname-' + $index">Surname</label>
        </div>
        <div class="form-floating">
          <input
            class="form-control"
            [id]="id + '-suffix-' + $index"
            [formField]="name.suffix"
          />
          <label [for]="id + '-suffix-' + $index">Suffix</label>
        </div>
      </div>
      <app-input-source-citations
        [formField]="name.citations"
        [workingDatabase]="workingDatabase()"
      ></app-input-source-citations>
    </details>
  }
</details>
