<div class="mb-3">
  <label for="name" class="form-label">Name</label>
  <input
    type="text"
    class="form-control"
    id="name"
    [formField]="form.name"
    placeholder="Repository Name"
  />
</div>
<div class="mb-3">
  <label for="url" class="form-label">URL</label>
  <input
    type="text"
    class="form-control"
    id="url"
    [formField]="form.url"
    placeholder="https://example.com"
  />
</div>
