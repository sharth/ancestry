<div class="form-floating">
  <input class="form-control h-auto" [formField]="form.title" id="title" />
  <label for="title">Title</label>
</div>

<div class="input-group">
  <label class="input-group-text path-label" for="sourceFile"
    >Source File</label
  >
  <input
    class="form-control"
    id="sourceFile"
    readonly
    [value]="sourceFileName()"
    placeholder="Choose a file with Browse..."
  />
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="browseFile()"
  >
    Browse...
  </button>
</div>

<div class="input-group has-validation">
  <label class="input-group-text path-label" for="filePath">File Path</label>
  @if (pendingFile()) {
    <input
      class="form-control"
      id="filePath"
      [class.is-invalid]="filePathProblem.value()"
      [placeholder]="proposedFileName()"
      [value]="copyFileName()"
      (input)="onCopyFileNameInput($event)"
    />
  } @else {
    <input
      class="form-control"
      id="filePath"
      [class.is-invalid]="filePathProblem.value()"
      [formField]="form.filePath"
    />
  }
  @if (filePathProblem.value(); as problem) {
    <div class="invalid-feedback">{{ problem }}</div>
  } @else if (pendingFile()) {
    <div class="form-text w-100">
      The source file is outside your data folder. It will be copied in at this
      path when you submit. Leave it empty to use the name shown.
    </div>
  }
</div>

<div class="form-floating">
  <input
    class="form-control h-auto"
    [formField]="form.mediaType"
    id="mediaType"
  />
  <label for="mediaType">Media Type</label>
</div>

@if (form.filePath().value()) {
  <app-multimedia-preview [filePath]="form.filePath().value()" />
}
