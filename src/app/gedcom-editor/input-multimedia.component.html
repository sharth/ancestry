<div class="form-floating">
  <input class="form-control h-auto" [formField]="form.title" id="title" />
  <label for="title">Title</label>
</div>

<div class="input-group">
  <div class="form-floating">
    <input
      class="form-control h-auto"
      [formField]="form.filePath"
      id="filePath"
    />
    <label for="filePath">File Path</label>
  </div>
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="browseFile()"
  >
    Browse...
  </button>
</div>

@if (pendingFile(); as file) {
  <div class="card card-body">
    <p class="mb-2">
      "{{ file.name }}" is outside your data folder. Copy it in to use it.
    </p>
    <div class="input-group has-validation">
      <label class="input-group-text" for="copyFileName">Copy as</label>
      <input
        class="form-control"
        id="copyFileName"
        [class.is-invalid]="copyError()"
        [placeholder]="proposedFileName()"
        [value]="copyFileName()"
        (input)="onCopyFileNameInput($event)"
      />
      <button class="btn btn-primary" type="button" (click)="copyFile()">
        Copy
      </button>
      <button
        class="btn btn-outline-secondary"
        type="button"
        (click)="cancelCopy()"
      >
        Cancel
      </button>
      @if (copyError()) {
        <div class="invalid-feedback">{{ copyError() }}</div>
      }
    </div>
  </div>
}

<div class="form-floating">
  <input
    class="form-control h-auto"
    [formField]="form.mediaType"
    id="mediaType"
  />
  <label for="mediaType">Media Type</label>
</div>

@if (form.filePath().value()) {
  <app-multimedia-preview [filePath]="form.filePath().value()" />
}
