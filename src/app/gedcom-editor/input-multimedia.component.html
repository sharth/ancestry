<div class="form-floating">
  <input class="form-control h-auto" [formField]="form.title" id="title" />
  <label for="title">Title</label>
</div>

<div class="input-group has-validation">
  <div class="form-floating" [class.is-invalid]="filePathProblem.value()">
    <input
      class="form-control h-auto"
      [class.is-invalid]="filePathProblem.value()"
      [formField]="form.filePath"
      (input)="followProposedFileName.set(false)"
      id="filePath"
    />
    <label for="filePath">File Path</label>
  </div>
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="browseFile()"
  >
    Browse...
  </button>
  @if (filePathProblem.value(); as problem) {
    <div class="invalid-feedback">{{ problem }}</div>
  } @else if (pendingFile(); as file) {
    <div class="form-text w-100">
      "{{ file.name }}" is outside your data folder. It will be copied in at
      this path when you submit.
    </div>
  }
</div>

<div class="form-floating">
  <input
    class="form-control h-auto"
    [formField]="form.mediaType"
    id="mediaType"
  />
  <label for="mediaType">Media Type</label>
</div>

@if (form.filePath().value()) {
  <app-multimedia-preview [filePath]="form.filePath().value()" />
}
