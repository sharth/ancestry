@if (collapseWhenEmpty() && form.length === 0) {
  <button
    type="button"
    class="btn btn-sm btn-outline-primary"
    (click)="appendCitation()"
  >
    <i class="bi bi-plus"></i> Add citation
  </button>
} @else {
  <details open>
    <summary>
      Citations ({{ form.length }})<button
        type="button"
        class="btn btn-sm btn-outline-primary ms-auto py-0"
        (click)="$event.preventDefault(); appendCitation()"
      >
        <i class="bi bi-plus"></i> Add citation
      </button>
    </summary>
    @for (formGroup of form; track formGroup) {
      <details open>
        <summary>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger bi-trash"
            aria-label="Remove citation"
            (click)="removeCitation($index)"
          ></button>
          @let sourceXref = formGroup.sourceXref().value();
          @let source = workingDatabase().sources[sourceXref];
          {{ source?.abbr || sourceXref }}
        </summary>
        <div class="form-floating">
          <app-input-source-xref
            #focusTarget
            [formField]="formGroup.sourceXref"
            [workingDatabase]="workingDatabase()"
          ></app-input-source-xref>
        </div>
        <div class="fields-grid">
          <div class="form-floating">
            <input
              class="form-control"
              [id]="id + '-page-' + $index"
              [formField]="formGroup.page"
            />
            <label [for]="id + '-page-' + $index">Page</label>
          </div>
          <div class="form-floating">
            <input
              class="form-control"
              [id]="id + '-quality-' + $index"
              [formField]="formGroup.quality"
            />
            <label [for]="id + '-quality-' + $index">Quality</label>
          </div>
        </div>
        <div class="form-floating">
          <textarea
            class="form-control"
            [id]="id + '-text-' + $index"
            [formField]="formGroup.text"
          ></textarea>
          <label [for]="id + '-text-' + $index">Text</label>
        </div>
        <app-input-multimedia-links
          [formField]="formGroup.multimediaLinks"
          [workingDatabase]="workingDatabase()"
        ></app-input-multimedia-links>
        <app-input-notes
          [formField]="formGroup.notes"
          [workingDatabase]="workingDatabase()"
        ></app-input-notes>
      </details>
    }
  </details>
}
