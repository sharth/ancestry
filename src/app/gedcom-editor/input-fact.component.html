<div class="fields-grid">
  @if (tagLocked()) {
    <div class="form-floating">
      <input
        class="form-control"
        [id]="id + '-tag'"
        readonly
        [value]="tagDescription()"
        title="The type of a saved fact can't be changed"
      />
      <label [for]="id + '-tag'">Tag <i class="bi bi-lock"></i></label>
    </div>
  } @else {
    <div class="form-floating">
      <select class="form-control" [id]="id + '-tag'" [formField]="form.tag">
        @for (event of gedcomEventTags(); track event.tag) {
          <option [value]="event.tag">
            {{ event.humanReadableDescription }}
          </option>
        }
      </select>
      <label [for]="id + '-tag'">Tag</label>
    </div>
  }
  <div class="form-floating">
    <input class="form-control" [id]="id + '-type'" [formField]="form.type" />
    <label [for]="id + '-type'">Type</label>
  </div>
  <div class="form-floating">
    <input
      class="form-control"
      [id]="id + '-date'"
      [formField]="form.date.value"
    />
    <label [for]="id + '-date'">Date</label>
  </div>
  <div class="form-floating">
    <input
      class="form-control"
      [id]="id + '-sdate'"
      [formField]="form.sortDate.value"
    />
    <label [for]="id + '-sdate'">Sort Date</label>
  </div>
  <div class="form-floating">
    <input
      class="form-control"
      [id]="id + '-address'"
      [formField]="form.address"
    />
    <label [for]="id + '-address'">Address</label>
  </div>
  <div class="form-floating">
    <input class="form-control" [id]="id + '-place'" [formField]="form.place" />
    <label [for]="id + '-place'">Place</label>
  </div>
  <div class="form-floating">
    <input class="form-control" [id]="id + '-cause'" [formField]="form.cause" />
    <label [for]="id + '-cause'">Cause</label>
  </div>
</div>
<app-input-source-citations
  [workingDatabase]="workingDatabase()"
  [formField]="form.citations"
></app-input-source-citations>
<app-input-shared-with
  [workingDatabase]="workingDatabase()"
  [formField]="form.sharedWith"
></app-input-shared-with>
<app-input-notes
  [workingDatabase]="workingDatabase()"
  [formField]="form.notes"
></app-input-notes>
