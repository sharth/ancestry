<form (submit)="submitForm()" class="vstack gap-3">
  @switch (type()) {
    @case ("INDI") {
      <app-gedcom-editor-individual
        [(workingDatabase)]="workingDatabase"
        [xref]="effectiveXref()"
      ></app-gedcom-editor-individual>
    }
    @case ("SOUR") {
      <app-gedcom-editor-source
        [(workingDatabase)]="workingDatabase"
        [xref]="effectiveXref()"
      ></app-gedcom-editor-source>
    }
    @case ("OBJE") {
      <app-gedcom-editor-multimedia
        [(workingDatabase)]="workingDatabase"
        [xref]="effectiveXref()"
      ></app-gedcom-editor-multimedia>
    }
    @case ("REPO") {
      <app-gedcom-editor-repository
        [(workingDatabase)]="workingDatabase"
        [xref]="effectiveXref()"
      ></app-gedcom-editor-repository>
    }
  }

  <h2>Gedcom Delta</h2>
  @for (r of differences(); track $index) {
    <app-gedcom-diff
      [oldGedcomRecord]="r.canonicalRecord"
      [newGedcomRecord]="r.currentRecord"
    ></app-gedcom-diff>
  }

  <input type="submit" />
  <input type="button" value="Cancel" (click)="cancelForm()" />
</form>
