<div class="d-flex gap-2 align-items-center">
  <div class="form-floating flex-grow-1">
    <select id="xref" #focusTarget class="form-select" [formField]="form">
      <option selected value="">Sources...</option>
      @for (source of sources(); track source.xref) {
        <option value="{{ source.xref }}">
          @if (source.abbr === undefined) {
            Untitled Source ({{ source.xref }})
          } @else {
            {{ source.abbr }} ({{ source.xref }})
          }
        </option>
      }
    </select>
    <label for="xref">Source</label>
  </div>
  @if (gedcomEditor) {
    <button
      type="button"
      class="btn btn-sm btn-outline-primary text-nowrap"
      (click)="createNewSource()"
      title="Create a new source and open in tab"
    >
      <i class="bi bi-plus"></i> New
    </button>
  }
</div>
