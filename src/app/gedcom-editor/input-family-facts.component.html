<details open>
  <summary>
    Events ({{ form.length }})<button
      type="button"
      class="btn btn-sm btn-outline-primary ms-auto py-0"
      (click)="$event.preventDefault(); appendEvent()"
    >
      <i class="bi bi-plus"></i> Add event
    </button>
  </summary>
  @for (event of form; track event) {
    <details open>
      <summary>
        <button
          type="button"
          class="btn btn-sm btn-outline-danger bi-trash"
          aria-label="Remove event"
          (click)="removeEvent($index)"
        ></button>
        {{ event.tag().value() }}
      </summary>
      <app-input-fact
        [workingDatabase]="workingDatabase()"
        [tags]="tags"
        [formField]="event"
      ></app-input-fact>
    </details>
  }
</details>
