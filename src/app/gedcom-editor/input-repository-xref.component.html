<div class="form-floating">
  <select [id]="id + '-xref'" class="form-select" [formField]="form">
    <option selected value="">Repositories...</option>
    @for (repository of repositories(); track repository.xref) {
      <option value="{{ repository.xref }}">
        {{ repository.name }}
      </option>
    }
  </select>
  <label [for]="id + '-xref'">Repository</label>
</div>
