<details [open]="open()">
  <summary>Events ({{ eventCount() }})</summary>
  @for (row of rows(); track row.id) {
    @let event = row.field;
    <details [open]="true">
      <summary>
        <button
          type="button"
          class="btn btn-sm btn-outline-danger bi-trash"
          aria-label="Remove event"
          (click)="removeEvent(row)"
        ></button>
        {{ event.tag().value() }}
      </summary>
      @if (row.familyXref) {
        <app-input-individual-xref
          label="Spouse"
          class="d-block mb-2"
          [workingDatabase]="workingDatabase()"
          [value]="spouseOf(row.familyXref)"
          (valueChange)="changeSpouse(row, $event)"
        ></app-input-individual-xref>
        <app-input-family-fact
          [workingDatabase]="workingDatabase()"
          [formField]="event"
          (tagPicked)="familyTagPicked(row, $event)"
        ></app-input-family-fact>
      } @else {
        <app-input-individual-fact
          [workingDatabase]="workingDatabase()"
          [formField]="event"
        ></app-input-individual-fact>
      }
    </details>
  }
  @if (pendingTag() !== undefined) {
    <details [open]="true">
      <summary>
        <button
          type="button"
          class="btn btn-sm btn-outline-danger bi-trash"
          aria-label="Remove event"
          (click)="pendingTag.set(undefined)"
        ></button>
        New event
      </summary>
      <div class="fields-grid">
        <div class="form-floating">
          <select
            #pendingTagSelect
            class="form-control"
            id="newTag"
            aria-label="Tag"
            (change)="choosePendingTag(pendingTagSelect.value)"
          >
            <option value="" disabled [selected]="!pendingTag()">
              Choose…
            </option>
            @for (tag of individualTags; track tag.tag) {
              <option [value]="tag.tag">
                {{ tag.humanReadableDescription }}
              </option>
            }
            <optgroup label="With a spouse">
              @for (tag of coupleTags; track tag.tag) {
                <option [value]="tag.tag" [selected]="tag.tag === pendingTag()">
                  {{ tag.humanReadableDescription }}
                </option>
              }
            </optgroup>
          </select>
          <label for="newTag">Tag</label>
        </div>
        @if (pendingTag()) {
          <app-input-individual-xref
            label="Spouse"
            [workingDatabase]="workingDatabase()"
            [value]="''"
            (valueChange)="choosePendingSpouse($event)"
          ></app-input-individual-xref>
        }
      </div>
    </details>
  }
  <div
    class="details-lookalike"
    tabindex="0"
    (click)="appendEvent()"
    (keydown.enter)="appendEvent()"
  >
    <button
      type="button"
      class="btn btn-sm btn-outline-primary bi-plus"
      aria-label="Add event"
      (click)="$event.preventDefault()"
    ></button>
    Append another event
  </div>
</details>
