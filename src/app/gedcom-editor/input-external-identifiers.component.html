<details open>
  <summary>External Trees ({{ form.length }})</summary>
  <datalist [id]="id + '-external-identifier-types'">
    @for (type of knownTypes(); track type) {
      <option [value]="type"></option>
    }
  </datalist>
  @for (externalIdentifier of form; track externalIdentifier) {
    <div class="d-flex gap-2 align-items-center mb-2">
      <button
        class="btn btn-sm btn-outline-danger bi-trash"
        type="button"
        aria-label="Remove external identifier"
        (click)="removeExternalIdentifier($index)"
      ></button>
      <div class="form-floating" style="flex: 1">
        <input
          class="form-control"
          type="text"
          [id]="id + '-external-identifier-id-' + $index"
          [formField]="externalIdentifier.id"
        />
        <label [for]="id + '-external-identifier-id-' + $index">ID</label>
      </div>
      <div class="form-floating" style="flex: 2">
        <input
          class="form-control"
          type="url"
          [attr.list]="id + '-external-identifier-types'"
          [id]="id + '-external-identifier-type-' + $index"
          [formField]="externalIdentifier.type"
        />
        <label [for]="id + '-external-identifier-type-' + $index"
          >Type (URI)</label
        >
      </div>
      <div style="width: 8rem">
        @if (links()[$index]; as link) {
          <a
            [href]="link.url"
            target="_blank"
            rel="noopener noreferrer nofollow"
            referrerpolicy="no-referrer"
            class="d-inline-flex gap-1 text-decoration-none"
          >
            <i class="bi bi-box-arrow-up-right"></i>
            <span class="text-decoration-underline">{{ link.label }}</span>
          </a>
        }
      </div>
    </div>
  }
  <div class="form-floating mb-2">
    <input
      class="form-control"
      type="url"
      [id]="id + '-external-identifier-url'"
      placeholder="Paste a FamilySearch or Ancestry person link"
      #urlInput
      [value]="pastedUrl()"
      (input)="addFromUrl(urlInput.value)"
    />
    <label [for]="id + '-external-identifier-url'">
      Paste a FamilySearch or Ancestry person link to add it
    </label>
    @if (pastedUrl() !== "") {
      <div class="form-text text-danger">
        That isn't a FamilySearch or Ancestry person page link.
      </div>
    }
  </div>
  <div class="d-flex gap-2">
    <button
      type="button"
      class="btn btn-sm btn-outline-primary"
      (click)="appendFamilySearchPersonId()"
    >
      <i class="bi bi-plus"></i> Add FamilySearch ID
    </button>
    <button
      type="button"
      class="btn btn-sm btn-outline-primary"
      (click)="appendExternalIdentifier()"
    >
      <i class="bi bi-plus"></i> Add other ID
    </button>
  </div>
</details>
