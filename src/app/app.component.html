<header>
  <button
    type="button"
    class="btn btn-outline-secondary d-md-none bi-list"
    aria-label="Toggle navigation"
    (click)="toggleSidebar()"
  ></button>

  <a class="navbar-brand" routerLink="/">
    <img src="favicon.ico" style="height: 1em" alt="Ancestry Logo" />
    ancestry.lynch.us
  </a>
  <div style="flex: 1"></div>
  <div class="d-none d-md-flex align-items-center gap-2">
    <input
      type="button"
      (click)="requestPermissions()"
      class="btn btn-outline-success"
      value="Request Permissions"
    />
    <input
      id="clearDatabaseButton"
      type="button"
      class="btn btn-outline-danger"
      (click)="clearDatabase()"
      value="Clear Database"
    />
    <div class="input-group w-auto">
      <input class="form-control" type="search" placeholder="Search" />
      <button class="btn btn-outline-success" type="submit">Search</button>
    </div>
  </div>
</header>

@if (sidebarOpen()) {
  <button
    type="button"
    class="nav-backdrop"
    aria-label="Close navigation"
    (click)="closeSidebar()"
  ></button>
}

<nav [class.open]="sidebarOpen()">
  <a routerLink="/" (click)="closeSidebar()">Home</a>
  <a routerLink="/individuals" (click)="closeSidebar()">Individuals</a>
  <a routerLink="/families" (click)="closeSidebar()">Families</a>
  <a routerLink="/sources" (click)="closeSidebar()">Sources</a>
  <a routerLink="/repositories" (click)="closeSidebar()">Repositories</a>
  <a routerLink="/multimedias" (click)="closeSidebar()">Multimedia</a>
  <a routerLink="/places" (click)="closeSidebar()">Places</a>
  <a routerLink="/validation" (click)="closeSidebar()">Validation</a>

  <div class="nav-actions d-md-none">
    <div class="input-group">
      <input class="form-control" type="search" placeholder="Search" />
      <button class="btn btn-outline-success" type="submit">Search</button>
    </div>
    <input
      type="button"
      (click)="requestPermissions()"
      class="btn btn-outline-success"
      value="Request Permissions"
    />
    <input
      type="button"
      class="btn btn-outline-danger"
      (click)="clearDatabase()"
      value="Clear Database"
    />
  </div>
</nav>

<main>
  <router-outlet />
</main>
