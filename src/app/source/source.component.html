@if (vm(); as vm) {
  <h1>{{ vm.source.abbr || vm.source.xref }}</h1>

  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="overview" routerLinkActive="active">
        Overview
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="citations" routerLinkActive="active">
        Citations
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="gedcom" routerLinkActive="active">
        Gedcom
      </a>
    </li>
  </ul>

  <router-outlet />

  <div class="position-fixed bottom-0 end-0 rounded-circle m-5">
    <button
      type="button"
      class="btn btn-primary btn-lg bi-pencil"
      aria-label="Edit source"
      (click)="editDialog.showModal()"
    ></button>
  </div>

  <app-gedcom-editor-dialog
    #editDialog
    [tabs]="[{ type: 'SOUR', xref: xref() }]"
    [ancestryDatabase]="ancestryDatabase()"
  />
}
