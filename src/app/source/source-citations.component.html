@if (vm(); as vm) {
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Individual</th>
        <th>Event</th>
        <th>Citation</th>
      </tr>
    </thead>
    <tbody>
      @for (citation of vm.citations; track citation) {
        <tr>
          <td>
            <app-individual-link [xref]="citation.individual.xref" />
          </td>
          <td>{{ citation.event }}</td>
          <td>{{ citation.citation.text }}</td>
        </tr>
      }
    </tbody>
  </table>
}
