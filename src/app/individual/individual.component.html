@if (vm(); as vm) {
  <h2>Name</h2>
  <p>{{ vm.name }}</p>

  <h2>Sex</h2>
  <!-- TODO: Include the citations. -->
  <p>{{ vm.sex }}</p>

  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="facts" routerLinkActive="active">
        Facts
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="ancestors" routerLinkActive="active">
        Ancestors
      </a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" routerLink="gedcom" routerLinkActive="active">
        Gedcom
      </a>
    </li>
  </ul>

  <router-outlet />

  <div class="position-fixed bottom-0 end-0 rounded-circle m-5">
    <button
      type="button"
      class="btn btn-primary btn-lg bi-pencil"
      aria-label="Edit individual"
      (click)="editDialog.showModal()"
    ></button>
  </div>

  <app-gedcom-editor-dialog
    #editDialog
    type="INDI"
    [xref]="xref()"
    [ancestryDatabase]="ancestryDatabase()"
  />
}
