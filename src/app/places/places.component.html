<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <h2>Places</h2>

      <ul class="list-group">
        @for (place of topLevelPlaces(); track place.name) {
          <li class="list-group-item">
            <a [routerLink]="['/place', ...placeNodeSlugs(place)]">{{
              place.name
            }}</a>
          </li>
        } @empty {
          <p>No places found.</p>
        }
      </ul>
    </div>
  </div>
</div>
