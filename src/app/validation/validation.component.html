<h1>Validation</h1>

<ul class="nav nav-tabs mb-3">
  @for (tab of tabs; track tab.id) {
    <li class="nav-item">
      <a class="nav-link" [routerLink]="tab.id" routerLinkActive="active">
        {{ tab.label }}
        <span class="badge rounded-pill text-bg-secondary">
          {{ tabCounts()[tab.id] }}
        </span>
      </a>
    </li>
  }
</ul>

<router-outlet />
