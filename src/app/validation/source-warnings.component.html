@if (rows().length === 0) {
  <p>No source has an error or a warning.</p>
} @else {
  <app-validation-table
    [gedcom]="gedcom()"
    [columns]="['Source', 'Message']"
    [columnSizes]="['minmax(0, 1fr)', 'minmax(0, 3fr)']"
    [rows]="rows()"
  >
    <ng-template let-row>
      <div role="cell">
        <a [routerLink]="['/source', row.source.xref]">
          {{ row.source.abbr || row.source.xref }}
        </a>
      </div>
      <div role="cell">
        @if (row.severity === "Error") {
          <span class="badge text-bg-danger">Error</span>
        }
        {{ row.message }}
      </div>
    </ng-template>
  </app-validation-table>
}
