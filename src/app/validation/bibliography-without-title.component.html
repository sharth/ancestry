@if (rows().length === 0) {
  <p>Every source with a bibliography (_BIBL) also has a title.</p>
} @else {
  <p>
    These sources have a bibliography (_BIBL) but no title. The suggested fix
    moves the bibliography into the title.
  </p>
  <app-validation-table
    [gedcom]="gedcom()"
    [columns]="['Source', 'Bibliography']"
    [rows]="rows()"
  >
    <ng-template let-row>
      <div role="cell">
        <a [routerLink]="['/source', row.source.xref]">
          {{ row.source.abbr || row.source.xref }}
        </a>
      </div>
      <div role="cell">{{ row.bibliography }}</div>
    </ng-template>
  </app-validation-table>
}
