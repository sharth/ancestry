@if (rows().length === 0) {
  <p>Every repository call number is used only once.</p>
} @else {
  <p>These call numbers appear more than once.</p>
  <app-validation-table [columns]="['Call number', 'Sources']" [rows]="rows()">
    <ng-template let-row>
      <div role="cell">
        <app-repository-call-number [callNumber]="row.callNumber" />
      </div>
      <div role="cell">
        <ul class="list-unstyled mb-0">
          @for (use of row.sources; track use.source.xref) {
            <li>
              <a [routerLink]="['/source', use.source.xref]">{{
                use.source.abbr || use.source.xref
              }}</a>
              @if (use.count > 1) {
                ({{ use.count }} times)
              }
            </li>
          }
        </ul>
      </div>
    </ng-template>
  </app-validation-table>
}
