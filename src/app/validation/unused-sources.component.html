@if (rows().length === 0) {
  <p>Every source is cited at least once.</p>
} @else {
  <p>No citation anywhere in the file uses these sources.</p>
  <app-validation-table
    [gedcom]="gedcom()"
    [columns]="['Source', 'Title']"
    [rows]="rows()"
  >
    <ng-template let-row>
      <div role="cell">
        <a [routerLink]="['/source', row.source.xref]">
          {{ row.source.abbr || row.source.xref }}
        </a>
      </div>
      <div role="cell">{{ row.source.title }}</div>
    </ng-template>
  </app-validation-table>
}
