@if (rows().length === 0) {
  <p>Every multimedia object is linked from at least one place.</p>
} @else {
  <p>Nothing in the file links to these multimedia objects.</p>
  <app-validation-table [columns]="['Multimedia', 'File']" [rows]="rows()">
    <ng-template let-row>
      <div role="cell">
        <a [routerLink]="['/multimedia', row.multimedia.xref]">
          {{
            row.multimedia.title ||
              row.multimedia.filePath ||
              row.multimedia.xref
          }}
        </a>
      </div>
      <div role="cell">{{ row.multimedia.filePath }}</div>
    </ng-template>
  </app-validation-table>
}
