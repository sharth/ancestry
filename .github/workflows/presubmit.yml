name: Angular Build and Test
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm clean-install
      - run: npx playwright install chromium --with-deps
      - run: npx @angular/cli build
      - name: "Wrap chromium with --disable-gpu (temporary, diagnostic)"
        run: |
          REAL_CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          WRAPPER="$RUNNER_TEMP/chromium-disable-gpu.sh"
          cat > "$WRAPPER" <<SCRIPT
          #!/bin/sh
          exec "$REAL_CHROME" --disable-gpu "\$@"
          SCRIPT
          chmod +x "$WRAPPER"
          echo "CHROME_BIN=$WRAPPER" >> "$GITHUB_ENV"
      - name: "Run tests (temporary: repeated, with --disable-gpu, to check whether it eliminates VITEST_BROWSER_CONNECTION_CLOSED)"
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i ==="
            npx @angular/cli test --no-progress --no-watch || exit 1
          done
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm clean-install
      - run: npx prettier --check src
