name: Angular Build and Test
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm clean-install
      - run: npx playwright install chromium --with-deps
      - run: npx @angular/cli build
      - name: "Run tests (temporary: with a background memory/process monitor to check whether a resource ceiling, not app code, is causing VITEST_BROWSER_CONNECTION_CLOSED)"
        run: |
          ( while true; do
              echo "=== $(date +%T.%N) ==="
              free -m
              echo "-- chrome process count / total RSS (MB) --"
              ps -eo pid,rss,comm | grep -i chrom | awk '{sum+=$2; n++} END {print n" processes, "sum/1024" MB"}'
              sleep 1
            done ) &
          MONITOR_PID=$!
          npx @angular/cli test --no-progress --no-watch
          TEST_EXIT=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          exit "$TEST_EXIT"
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm clean-install
      - run: npx prettier --check src
