name: Angular Build and Test
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm clean-install
      - run: npx playwright install chromium --with-deps
      - run: npx @angular/cli build
      - name: "Run tests (temporary: sharded into small groups, each its own process, to check whether limiting page/browser reuse eliminates VITEST_BROWSER_CONNECTION_CLOSED)"
        run: |
          mapfile -t ALL_SPECS < <(npx @angular/cli test --list-tests | grep 'spec\.ts$' | sed 's/^[[:space:]]*//')
          echo "Discovered ${#ALL_SPECS[@]} spec files"
          shard_size=10
          total=${#ALL_SPECS[@]}
          for ((i = 0; i < total; i += shard_size)); do
            shard=("${ALL_SPECS[@]:i:shard_size}")
            args=()
            for f in "${shard[@]}"; do
              args+=(--include "$f")
            done
            echo "=== shard starting at index $i (${#shard[@]} files) ==="
            npx @angular/cli test --no-progress --no-watch "${args[@]}"
          done
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm clean-install
      - run: npx prettier --check src
