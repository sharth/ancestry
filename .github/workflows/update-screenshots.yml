name: Update Screenshot Baselines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm clean-install
      - run: npx playwright install chromium --with-deps
      - run: npx @angular/cli build
      - name: Run tests to (re)generate missing screenshot baselines
        run: npx @angular/cli test --no-progress --no-watch
        continue-on-error: true
      - name: Commit regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .vitest-screenshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Update screenshot baselines [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
